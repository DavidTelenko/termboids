# Termboids Configuration File
# This file configures keyboard shortcuts and boid simulation parameters

[rendering]
# Target framerate
fps = 60

# Use GPU compute shader for boid calculations
# Provides significant performance improvement for large numbers of boids
# Falls back to CPU if GPU initialization fails
use_gpu = true

[keybindings]
# Press 'c' or 'C' to cycle through color modes
# Available modes: None (white), Force-based, Distance-based
cycle_color_mode = "c"

# Press 'd' or 'D' to toggle debug spatial grid visualization
debug_grid = "d"

# Press 'q' to quit the application
quit = "q"

[boids]
# Number of boids in the simulation
num_boids = 1000

# Maximum speed (pixels per second)
max_speed = 50.0

# Maximum force/acceleration (pixels per second squared)
max_force = 80.0

# Separation radius - distance at which boids avoid each other
separation_radius = 5.0

# Alignment radius - distance for matching neighbor velocities
alignment_radius = 5.0

# Cohesion radius - distance for moving toward group center
cohesion_radius = 1000.0

# Separation weight - strength of avoidance behavior
separation_weight = 1.8

# Alignment weight - strength of velocity matching
alignment_weight = 1.2

# Cohesion weight - strength of grouping behavior
cohesion_weight = 1.0

# Random weight - strength of random forces (prevents stabilization)
# Set to 0 to disable random behavior
random_weight = 25.15

# Render radius - size of each boid (1 = single pixel)
render_radius = 1
